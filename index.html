<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | DramaConnect Enterprise v4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden animate-fade-in">
        <div class="rccg-blue p-10 text-white text-center relative">
            <div class="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none">
                <svg width="100%" height="100%"><pattern id="pattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="2" fill="white"/></pattern><rect width="100%" height="100%" fill="url(#pattern)"/></svg>
            </div>
            <img src="assets/img/rccg_logo.png" alt="RCCG Logo" class="h-24 w-24 mx-auto mb-4 bg-white rounded-full p-2 shadow-lg">
            <h1 class="text-3xl font-extrabold tracking-tight">DramaConnect <span class="text-blue-300">Pro</span></h1>
            <p class="text-blue-100 mt-2 opacity-90">RCCG LP 25 Drama Department</p>
        </div>

        <div class="p-8">
            <div id="auth-container">
                <div id="login-section">
                    <h2 class="text-2xl font-bold text-slate-800 mb-6 text-center">Institutional Sign In</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase mb-1 ml-1">Email Address</label>
                            <input type="email" id="email" class="w-full p-3 border-2 border-slate-100 rounded-xl focus:border-blue-500 outline-none transition" placeholder="email@rccg.org">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase mb-1 ml-1">Password</label>
                            <input type="password" id="password" class="w-full p-3 border-2 border-slate-100 rounded-xl focus:border-blue-500 outline-none transition" placeholder="••••••••">
                        </div>
                        <button id="login-btn" class="w-full py-4 rccg-blue text-white rounded-xl font-bold shadow-lg hover:bg-blue-800 transition transform active:scale-95 flex items-center justify-center gap-2">
                            <span>Access Portal</span> <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                    <div class="mt-8 text-center">
                        <p class="text-sm text-gray-500">New member? <a href="#" id="go-signup" class="text-blue-600 font-bold hover:underline">Request Access</a></p>
                    </div>
                </div>

                <div id="signup-section" class="hidden">
                    <h2 class="text-2xl font-bold text-slate-800 mb-6 text-center">Member Registration</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase mb-1 ml-1">Full Name</label>
                            <input type="text" id="sig-name" class="w-full p-3 border-2 border-slate-100 rounded-xl focus:border-blue-500 outline-none transition" placeholder="Enter full name">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase mb-1 ml-1">Email</label>
                            <input type="email" id="sig-email" class="w-full p-3 border-2 border-slate-100 rounded-xl focus:border-blue-500 outline-none transition" placeholder="email@rccg.org">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase mb-1 ml-1">Password</label>
                            <input type="password" id="sig-password" class="w-full p-3 border-2 border-slate-100 rounded-xl focus:border-blue-500 outline-none transition" placeholder="••••••••">
                        </div>
                        <button id="signup-btn" class="w-full py-4 rccg-blue text-white rounded-xl font-bold shadow-lg hover:bg-blue-800 transition transform active:scale-95">
                            Submit Application
                        </button>
                    </div>
                    <div class="mt-8 text-center">
                        <p class="text-sm text-gray-500">Already have an account? <a href="#" id="go-login" class="text-blue-600 font-bold hover:underline">Sign In</a></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Brand Engine: Driving traffic to HMG Concepts -->
        <div class="bg-blue-50 p-6 text-center border-t border-blue-100">
            <p class="text-[11px] text-slate-500 uppercase tracking-widest font-bold mb-3">Architected by</p>
            <div class="flex flex-col items-center gap-2">
                <a href="https://cssadewale.pages.dev" target="_blank" class="text-blue-700 font-extrabold text-lg hover:text-blue-900 transition">
                    Adewale Samson Adeagbo
                </a>
                <div class="flex gap-3 text-[10px] font-bold text-slate-400 uppercase">
                    <span class="hover:text-blue-600 cursor-pointer transition">DataTech</span>
                    <span>&bull;</span>
                    <span class="hover:text-blue-600 cursor-pointer transition">EdTech</span>
                    <span>&bull;</span>
                    <span class="hover:text-blue-600 cursor-pointer transition">FaithTech</span>
                </div>
                <a href="https://hmgconcepts.pages.dev" target="_blank" class="mt-2 px-4 py-1 bg-white text-blue-600 border border-blue-200 rounded-full text-[10px] font-bold hover:bg-blue-600 hover:text-white transition shadow-sm">
                    Explore HMG Concepts &rarr;
                </a>
            </div>
        </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        document.getElementById('go-signup').onclick = () => {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('signup-section').classList.remove('hidden');
        }
        document.getElementById('go-login').onclick = () => {
            document.getElementById('signup-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
        }

        document.getElementById('login-btn').onclick = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try {
                await Auth.signIn(email, pass);
                window.location.href = 'pages/dashboard.html';
            } catch (e) { alert(e.message); }
        }

        document.getElementById('signup-btn').onclick = async () => {
            const name = document.getElementById('sig-name').value;
            const email = document.getElementById('sig-email').value;
            const pass = document.getElementById('sig-password').value;
            try {
                await Auth.signUp(email, pass, name);
                alert('Application submitted! An admin will approve your access shortly.');
                document.getElementById('signup-section').classList.add('hidden');
                document.getElementById('login-section').classList.remove('hidden');
            } catch (e) { alert(e.message); }
        }
    </script>
</body>
</html>
