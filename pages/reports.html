<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | DramaConnect Enterprise</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/fallback.css">
    <script src="../assets/js/boot.js"></script>
</head>
<body class="bg-slate-50 min-h-screen app-shell">
    <div id="app-sidebar"></div>
    <main class="app-main">
        <div id="page-header"></div>

        <div class="glass-card p-6 mb-6 no-print">
            <div class="flex flex-wrap items-center gap-3">
                <label class="font-bold text-slate-700">Dataset:</label>
                <select id="dataset" class="dc-input max-w-xs">
                    <option value="members">Members</option>
                    <option value="finances">Finance Ledger</option>
                    <option value="productions">Productions</option>
                    <option value="attendance">Attendance Report</option>
                    <option value="events">Events</option>
                </select>
                <button id="load-btn" class="dc-btn dc-btn-primary py-2.5">Preview</button>
                <button id="excel-btn" class="dc-btn bg-green-600 text-white py-2.5"><i class="fas fa-file-excel mr-1"></i> Excel</button>
                <button id="csv-btn" class="dc-btn bg-slate-600 text-white py-2.5"><i class="fas fa-file-csv mr-1"></i> CSV</button>
                <button id="pdf-btn" class="dc-btn bg-red-600 text-white py-2.5"><i class="fas fa-file-pdf mr-1"></i> PDF</button>
                <button id="print-btn" class="dc-btn bg-slate-800 text-white py-2.5"><i class="fas fa-print mr-1"></i> Print</button>
            </div>
        </div>

        <div class="glass-card p-6 md:p-8 animate-fade-in">
            <div class="overflow-x-auto">
                <table class="enterprise-table" id="report-table">
                    <thead id="report-head"></thead>
                    <tbody id="report-body"><tr><td class="text-center text-slate-400 py-8">Select a dataset and click Preview.</td></tr></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/resilience.js"></script>
    <script src="../assets/js/data-portability.js"></script>
    <script src="../assets/js/drive-sync.js"></script>
    <script src="../assets/js/i18n.js"></script>
    <script src="../assets/js/ui.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/db.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/install.js"></script>
    <script>
        let me = null, currentData = [];
        async function init() {
            me = await Auth.checkSession();
            if (!me) return;
            Layout.renderSidebar('reports', me);
            document.getElementById('page-header').innerHTML = Layout.renderHeader('Reports', 'Generate & export official reports');
            Layout.setDate();
            if (Layout.loadNotifications) Layout.loadNotifications(me);
            document.getElementById('load-btn').onclick = loadReport;
            document.getElementById('excel-btn').onclick = () => Utils.exportToExcel(flatten(currentData), ds() + '.xlsx');
            document.getElementById('csv-btn').onclick = () => Utils.exportToCSV(flatten(currentData), ds() + '.csv');
            document.getElementById('pdf-btn').onclick = () => Utils.exportToPDF('report-table', ds() + '.pdf');
            document.getElementById('print-btn').onclick = () => Utils.printPage();
        }
        const ds = () => document.getElementById('dataset').value;
        function flatten(rows) {
            return rows.map(r => {
                const o = {};
                for (const k in r) o[k] = (r[k] && typeof r[k] === 'object') ? JSON.stringify(r[k]) : r[k];
                return o;
            });
        }
        async function loadReport() {
            UI.showLoader('Building report…');
            try {
                const v = ds();
                if (v === 'members') currentData = await DB.getMembers();
                else if (v === 'finances') currentData = await DB.getTransactions();
                else if (v === 'productions') currentData = await DB.getProductions();
                else if (v === 'events') currentData = await DB.getEvents();
                else if (v === 'attendance') currentData = (await DB.getAttendanceReport()).map(a => ({
                    member: a.profiles ? a.profiles.full_name : '—',
                    rehearsal_date: a.rehearsals ? a.rehearsals.rehearsal_date : '—',
                    status: a.status
                }));
                renderTable(currentData);
                UI.hideLoader();
            } catch (e) { UI.hideLoader(); UI.toast(e.message, 'error'); }
        }
        function renderTable(rows) {
            const head = document.getElementById('report-head');
            const body = document.getElementById('report-body');
            if (!rows.length) { head.innerHTML = ''; body.innerHTML = '<tr><td class="text-center text-slate-400 py-8">No data.</td></tr>'; return; }
            const cols = Object.keys(rows[0]);
            head.innerHTML = '<tr>' + cols.map(c => `<th>${UI.esc(c)}</th>`).join('') + '</tr>';
            body.innerHTML = rows.map(r => '<tr>' + cols.map(c => {
                let v = r[c]; if (v && typeof v === 'object') v = JSON.stringify(v);
                return `<td>${UI.esc(v ?? '—')}</td>`;
            }).join('') + '</tr>').join('');
        }
        init();
    </script>
</body>
</html>
