<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthdays | DramaConnect Enterprise</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/fallback.css">
    <script src="../assets/js/boot.js"></script>
</head>
<body class="bg-slate-50 min-h-screen app-shell">
    <div id="app-sidebar"></div>
    <main class="app-main">
        <div id="page-header"></div>

        <!-- Today's birthdays -->
        <div class="glass-card p-6 md:p-8 mb-6 animate-fade-in border-l-4 border-pink-500">
            <h3 class="text-lg font-bold text-slate-800 mb-4"><i class="fas fa-cake-candles text-pink-500 mr-2"></i> Today's Celebrants 🎉</h3>
            <div id="today-list" class="space-y-3"><p class="text-slate-400 text-sm">Loading…</p></div>
        </div>

        <!-- This month -->
        <div class="glass-card p-6 md:p-8 animate-fade-in">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                <h3 class="text-lg font-bold text-slate-800"><i class="fas fa-calendar-day text-blue-600 mr-2"></i> Birthdays by Month</h3>
                <select id="month-filter" class="dc-input max-w-[180px]"></select>
            </div>
            <div id="month-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"><p class="text-slate-400 text-sm">Loading…</p></div>
        </div>
    </main>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/ui.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/db.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/install.js"></script>
    <script>
        let me = null, members = [];
        async function init() {
            me = await Auth.checkSession();
            if (!me) return;
            Layout.renderSidebar('birthdays', me);
            document.getElementById('page-header').innerHTML = Layout.renderHeader('Birthdays', 'Celebrate every member');
            Layout.setDate();
            if (Layout.loadNotifications) Layout.loadNotifications(me);

            const mf = document.getElementById('month-filter');
            mf.innerHTML = '<option value="0">All months</option>' +
                Array.from({length:12}, (_,i) => `<option value="${i+1}" ${i+1===new Date().getMonth()+1?'selected':''}>${Utils.monthName(i+1)}</option>`).join('');
            mf.onchange = renderMonth;

            try {
                members = (await DB.getMembers()).filter(m => m.birth_month && m.birth_day);
                renderToday(); renderMonth();
            } catch (e) { UI.toast(e.message, 'error'); }
        }

        function card(m, withActions) {
            const msg = Utils.birthdayMessage(m);
            return `
            <div class="flex items-center justify-between gap-3 p-3 bg-slate-50 rounded-xl">
                <div class="flex items-center gap-3 min-w-0">
                    <div class="h-10 w-10 rounded-full bg-pink-500 text-white flex items-center justify-center text-xs font-bold">${UI.esc(Utils.initials(m.full_name))}</div>
                    <div class="min-w-0">
                        <p class="font-bold text-slate-800 text-sm truncate">${UI.esc(m.full_name || 'Member')}</p>
                        <p class="text-xs text-slate-400">${Utils.monthName(m.birth_month)} ${m.birth_day}</p>
                    </div>
                </div>
                ${withActions ? `<div class="flex gap-2">
                    ${m.phone || m.whatsapp ? `<a href="${Utils.whatsappLink(m.whatsapp||m.phone, msg)}" target="_blank" rel="noopener" class="text-green-600" title="WhatsApp greeting"><i class="fab fa-whatsapp"></i></a>` : ''}
                    ${m.email ? `<a href="${Utils.mailtoLink(m.email,'Happy Birthday! 🎉',msg,false)}" class="text-blue-600" title="Email greeting"><i class="fas fa-envelope"></i></a>` : ''}
                </div>` : ''}
            </div>`;
        }

        function renderToday() {
            const now = new Date();
            const list = members.filter(m => m.birth_month === now.getMonth()+1 && m.birth_day === now.getDate());
            document.getElementById('today-list').innerHTML = list.length
                ? list.map(m => card(m, Auth.isAdmin(me))).join('')
                : '<p class="text-slate-400 text-sm">No birthdays today.</p>';
        }
        function renderMonth() {
            const mo = parseInt(document.getElementById('month-filter').value);
            let list = members.slice();
            if (mo) list = list.filter(m => m.birth_month === mo);
            list.sort((a,b) => (a.birth_month-b.birth_month) || (a.birth_day-b.birth_day));
            document.getElementById('month-list').innerHTML = list.length
                ? list.map(m => card(m, Auth.isAdmin(me))).join('')
                : '<p class="text-slate-400 text-sm">No birthdays recorded for this selection.</p>';
        }
        init();
    </script>
</body>
</html>
