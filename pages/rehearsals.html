<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rehearsals | DramaConnect Enterprise</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-slate-50 min-h-screen flex">
    <div id="app-sidebar"></div>
    <main class="flex-1 h-screen overflow-y-auto p-6 md:p-8">
        <div id="page-header"></div>

        <div id="admin-add" class="glass-card p-6 mb-8 admin-only">
            <h3 class="font-bold text-slate-800 mb-4"><i class="fas fa-calendar-plus text-blue-600 mr-2"></i> Log Rehearsal</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <input id="r-date" type="date" class="dc-input">
                <input id="r-note" placeholder="Goal (e.g. Act 1 Blocking)" class="dc-input md:col-span-2">
            </div>
            <button id="r-add-btn" class="dc-btn dc-btn-primary mt-4">Create Session</button>
        </div>

        <div class="glass-card p-6 md:p-8 animate-fade-in">
            <h3 class="text-lg font-bold text-slate-800 mb-6"><i class="fas fa-calendar-check text-blue-600 mr-2"></i> Sessions</h3>
            <div id="rehearsal-list" class="space-y-3"><p class="text-slate-400 text-sm">Loading…</p></div>
        </div>
    </main>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/ui.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/db.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/install.js"></script>
    <script>
        let me = null;
        async function init() {
            me = await Auth.checkSession();
            if (!me) return;
            Layout.renderSidebar('rehearsals', me);
            document.getElementById('page-header').innerHTML = Layout.renderHeader('Rehearsals', 'Sessions & goals');
            Layout.setDate();
            if (Auth.isAdmin(me)) {
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
                document.getElementById('r-add-btn').onclick = add;
            }
            load();
        }
        async function load() {
            const list = document.getElementById('rehearsal-list');
            try {
                const items = await DB.getRehearsals();
                if (!items.length) { list.innerHTML = '<p class="text-slate-400 text-sm">No rehearsals logged.</p>'; return; }
                const isAdmin = Auth.isAdmin(me);
                list.innerHTML = items.map(r => {
                    const present = r.attendance ? r.attendance.filter(a => a.status === 'present').length : 0;
                    return `
                    <div class="flex flex-wrap items-center justify-between gap-3 p-4 bg-slate-50 rounded-2xl">
                        <div>
                            <p class="font-bold text-slate-800">${Utils.formatDate(r.rehearsal_date)} <span class="text-xs text-slate-400">• ${Utils.relativeTime(r.rehearsal_date)}</span></p>
                            <p class="text-sm text-slate-500">${UI.esc(r.notes || 'No notes')}</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="badge badge-green">${present} present</span>
                            <a href="attendance.html?rehearsal=${r.id}" class="text-blue-600 text-xs font-bold hover:underline">Mark Attendance</a>
                            ${isAdmin ? `<button class="text-red-600 text-xs font-bold hover:underline" onclick="del('${r.id}')">Delete</button>` : ''}
                        </div>
                    </div>`;
                }).join('');
            } catch (e) { list.innerHTML = `<p class="text-red-500">${UI.esc(e.message)}</p>`; }
        }
        async function add() {
            const date = document.getElementById('r-date').value;
            if (!date) { UI.toast('Date is required.', 'warning'); return; }
            try {
                await DB.createRehearsal(date, document.getElementById('r-note').value.trim() || null);
                await DB.logActivity('rehearsal_add', date);
                document.getElementById('r-date').value = ''; document.getElementById('r-note').value = '';
                UI.toast('Session created.', 'success');
                load();
            } catch (e) { UI.toast(e.message, 'error'); }
        }
        async function del(id) {
            if (!await UI.confirm('Delete this rehearsal and its attendance?')) return;
            try { await DB.deleteRehearsal(id); UI.toast('Deleted.', 'success'); load(); }
            catch (e) { UI.toast(e.message, 'error'); }
        }
        window.del = del;
        init();
    </script>
</body>
</html>
