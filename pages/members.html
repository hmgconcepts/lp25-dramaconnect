<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members | DramaConnect Enterprise</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-slate-50 min-h-screen flex">
    <div id="app-sidebar"></div>
    <main class="flex-1 h-screen overflow-y-auto p-6 md:p-8">
        <div id="page-header"></div>

        <div class="glass-card p-6 md:p-8 animate-fade-in">
            <div class="flex flex-wrap justify-between items-center gap-3 mb-6">
                <h3 class="text-lg font-bold text-slate-800"><i class="fas fa-users text-blue-600 mr-2"></i> Personnel Directory</h3>
                <input id="search" class="dc-input max-w-xs" placeholder="🔍 Search name, email, parish…">
            </div>
            <div class="overflow-x-auto">
                <table class="enterprise-table" id="members-table">
                    <thead><tr><th>Member</th><th>Email</th><th>Phone</th><th>Parish</th><th>Role</th><th id="actions-col" class="admin-only">Actions</th></tr></thead>
                    <tbody id="members-body"><tr><td colspan="6" class="text-center text-slate-400 py-8">Loading members…</td></tr></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/ui.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/db.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script>
        let me = null, all = [];
        async function init() {
            me = await Auth.checkSession();
            if (!me) return;
            Layout.renderSidebar('members', me);
            document.getElementById('page-header').innerHTML = Layout.renderHeader('Members', 'Department personnel directory');
            Layout.setDate();
            if (Auth.isAdmin(me)) document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'table-cell');
            document.getElementById('search').oninput = e => render(filter(e.target.value));
            await load();
        }
        function filter(q) {
            q = (q || '').toLowerCase();
            return all.filter(m => [m.full_name, m.email, m.parish].some(v => (v || '').toLowerCase().includes(q)));
        }
        async function load() {
            try { all = await DB.getMembers(); render(all); }
            catch (e) { document.getElementById('members-body').innerHTML = `<tr><td colspan="6" class="text-center text-red-500 py-8">${UI.esc(e.message)}</td></tr>`; }
        }
        function render(list) {
            const isAdmin = Auth.isAdmin(me);
            const body = document.getElementById('members-body');
            if (!list.length) { body.innerHTML = '<tr><td colspan="6" class="text-center text-slate-400 py-8">No members found.</td></tr>'; return; }
            body.innerHTML = list.map(m => `
                <tr>
                    <td><div class="flex items-center gap-3"><div class="h-9 w-9 rounded-full rccg-blue text-white flex items-center justify-center text-xs font-bold">${UI.esc(Utils.initials(m.full_name))}</div><span class="font-semibold text-slate-800">${UI.esc(m.full_name || '—')}</span></div></td>
                    <td>${UI.esc(m.email || '—')}</td>
                    <td>${UI.esc(m.phone || '—')}</td>
                    <td>${UI.esc(m.parish || '—')}</td>
                    <td><span class="badge ${m.role === 'admin' ? 'badge-admin' : 'badge-member'}">${UI.esc(m.role || 'member')}</span></td>
                    ${isAdmin ? `<td><button class="text-blue-600 hover:underline text-xs font-bold" onclick="toggleRole('${m.id}','${m.role}')">${m.role === 'admin' ? 'Demote' : 'Promote'}</button></td>` : ''}
                </tr>`).join('');
        }
        async function toggleRole(id, current) {
            const next = current === 'admin' ? 'member' : 'admin';
            if (!await UI.confirm(`Change this member's role to "${next}"?`)) return;
            try {
                await DB.setMemberRole(id, next);
                await DB.logActivity('role_change', `Set member ${id} to ${next}`);
                UI.toast('Role updated.', 'success');
                await load();
            } catch (e) { UI.toast(e.message, 'error'); }
        }
        window.toggleRole = toggleRole;
        init();
    </script>
</body>
</html>
