<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Log | DramaConnect Enterprise</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/fallback.css">
    <script src="../assets/js/boot.js"></script>
</head>
<body class="bg-slate-50 min-h-screen app-shell">
    <div id="app-sidebar"></div>
    <main class="app-main">
        <div id="page-header"></div>
        <div class="glass-card p-6 md:p-8">
            <h3 class="text-lg font-bold text-slate-800 mb-6"><i class="fas fa-clock-rotate-left text-blue-600 mr-2"></i> Recent Activity</h3>
            <div class="overflow-x-auto">
                <table class="enterprise-table">
                    <thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Detail</th></tr></thead>
                    <tbody id="log-body"><tr><td colspan="4" class="text-center text-slate-400 py-8">Loading…</td></tr></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/ui.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/db.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/install.js"></script>
    <script>
        async function init() {
            const me = await Auth.requireAdmin();
            if (!me) return;
            Layout.renderSidebar('activity', me);
            document.getElementById('page-header').innerHTML = Layout.renderHeader('Activity Log', 'Audit trail of administrative actions');
            Layout.setDate();
            if (Layout.loadNotifications) Layout.loadNotifications(me);
            const body = document.getElementById('log-body');
            try {
                const logs = await DB.getActivityLog(150);
                if (!logs.length) { body.innerHTML = '<tr><td colspan="4" class="text-center text-slate-400 py-8">No activity recorded.</td></tr>'; return; }
                body.innerHTML = logs.map(l => `
                    <tr>
                        <td class="text-xs text-slate-400">${Utils.formatDateTime(l.created_at)}</td>
                        <td class="font-semibold text-slate-800">${UI.esc(l.actor_name || 'system')}</td>
                        <td><span class="badge badge-member">${UI.esc(l.action)}</span></td>
                        <td>${UI.esc(l.detail || '—')}</td>
                    </tr>`).join('');
            } catch (e) { body.innerHTML = `<tr><td colspan="4" class="text-center text-red-500 py-8">${UI.esc(e.message)}</td></tr>`; }
        }
        init();
    </script>
</body>
</html>
