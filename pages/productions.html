<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productions | DramaConnect Enterprise</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/fallback.css">
    <script src="../assets/js/boot.js"></script>
</head>
<body class="bg-slate-50 min-h-screen app-shell">
    <div id="app-sidebar"></div>
    <main class="app-main">
        <div id="page-header"></div>

        <div id="admin-add" class="glass-card p-6 mb-8 admin-only">
            <h3 class="font-bold text-slate-800 mb-4"><i class="fas fa-plus-circle text-blue-600 mr-2"></i> Add Production</h3>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                <input id="p-title" placeholder="Title" class="dc-input">
                <input id="p-date" type="date" class="dc-input">
                <input id="p-director" placeholder="Director" class="dc-input">
                <input id="p-script" placeholder="Script URL (Google Drive…)" class="dc-input">
            </div>
            <button id="p-add-btn" class="dc-btn dc-btn-primary mt-4">Save Production</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="prod-grid"><p class="text-slate-400">Loading productions…</p></div>
    </main>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/ui.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/db.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/install.js"></script>
    <script>
        let me = null;
        async function init() {
            me = await Auth.checkSession();
            if (!me) return;
            Layout.renderSidebar('productions', me);
            document.getElementById('page-header').innerHTML = Layout.renderHeader('Productions', 'Plays, scripts & performance timeline');
            Layout.setDate();
            if (Layout.loadNotifications) Layout.loadNotifications(me);
            if (Auth.isAdmin(me)) {
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
                document.getElementById('p-add-btn').onclick = add;
            }
            load();
        }
        async function load() {
            const grid = document.getElementById('prod-grid');
            try {
                const plays = await DB.getProductions();
                if (!plays.length) { grid.innerHTML = '<p class="text-slate-400">No productions yet.</p>'; return; }
                const isAdmin = Auth.isAdmin(me);
                grid.innerHTML = plays.map(p => {
                    const days = Utils.daysUntil(p.performance_date);
                    const status = days === null ? '' : days < 0 ? '<span class="badge badge-member">Completed</span>' : days <= 14 ? '<span class="badge badge-red">Soon</span>' : '<span class="badge badge-green">Upcoming</span>';
                    return `
                    <div class="glass-card p-6 animate-fade-in">
                        <div class="flex items-center justify-between mb-3">
                            <span class="p-2 bg-red-50 text-red-600 rounded-xl"><i class="fas fa-theater-masks"></i></span>
                            ${status}
                        </div>
                        <h4 class="text-lg font-bold text-slate-800">${UI.esc(p.title)}</h4>
                        <p class="text-sm text-slate-500 mt-1"><i class="fas fa-calendar mr-1"></i> ${Utils.formatDate(p.performance_date)} ${days !== null ? '• ' + Utils.relativeTime(p.performance_date) : ''}</p>
                        <p class="text-sm text-slate-500"><i class="fas fa-user-tie mr-1"></i> ${UI.esc(p.director || '—')}</p>
                        <div class="flex gap-3 mt-3">
                            ${p.script_url ? `<a href="${UI.esc(p.script_url)}" target="_blank" rel="noopener" class="text-sm text-blue-600 font-bold hover:underline"><i class="fas fa-file-alt mr-1"></i> Script</a>` : ''}
                            ${isAdmin ? `<button class="text-sm text-red-600 font-bold hover:underline" onclick="del('${p.id}')"><i class="fas fa-trash mr-1"></i> Delete</button>` : ''}
                        </div>
                    </div>`;
                }).join('');
            } catch (e) { grid.innerHTML = `<p class="text-red-500">${UI.esc(e.message)}</p>`; }
        }
        async function add() {
            const title = document.getElementById('p-title').value.trim();
            if (!title) { UI.toast('Title is required.', 'warning'); return; }
            try {
                await DB.addProduction({
                    title,
                    performance_date: document.getElementById('p-date').value || null,
                    director: document.getElementById('p-director').value.trim() || null,
                    script_url: document.getElementById('p-script').value.trim() || null
                });
                await DB.logActivity('production_add', title);
                ['p-title', 'p-date', 'p-director', 'p-script'].forEach(id => document.getElementById(id).value = '');
                UI.toast('Production added.', 'success');
                load();
            } catch (e) { UI.toast(e.message, 'error'); }
        }
        async function del(id) {
            if (!await UI.confirm('Delete this production? This also removes its casting and budget.')) return;
            try { await DB.deleteProduction(id); await DB.logActivity('production_delete', id); UI.toast('Deleted.', 'success'); load(); }
            catch (e) { UI.toast(e.message, 'error'); }
        }
        window.del = del;
        init();
    </script>
</body>
</html>
