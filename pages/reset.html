<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | DramaConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/fallback.css">
    <script src="../assets/js/boot.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden animate-fade-in">
        <div class="rccg-blue p-8 text-white text-center">
            <img src="../assets/img/rccg_logo.png" alt="RCCG" class="h-16 w-16 mx-auto mb-3 bg-white rounded-full p-1">
            <h1 class="text-2xl font-extrabold">Set New Password</h1>
        </div>
        <div class="p-8 space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-1 ml-1">New Password</label>
                <input type="password" id="np" class="dc-input" placeholder="Minimum 6 characters">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-1 ml-1">Confirm Password</label>
                <input type="password" id="cp" class="dc-input" placeholder="Re-enter password">
            </div>
            <button id="save" class="w-full py-4 rccg-blue text-white rounded-xl font-bold hover:bg-blue-800 transition">Update Password</button>
            <p class="text-center text-sm"><a href="../index.html" class="text-blue-600 font-bold hover:underline">Back to Sign In</a></p>
        </div>
    </div>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/ui.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        document.getElementById('save').onclick = async () => {
            const np = document.getElementById('np').value;
            const cp = document.getElementById('cp').value;
            if (np.length < 6) { UI.toast('Password must be at least 6 characters.', 'warning'); return; }
            if (np !== cp) { UI.toast('Passwords do not match.', 'warning'); return; }
            UI.showLoader('Updating…');
            try {
                await Auth.updatePassword(np);
                UI.hideLoader();
                UI.toast('Password updated. Please sign in.', 'success');
                setTimeout(() => window.location.href = '../index.html', 1500);
            } catch (e) { UI.hideLoader(); UI.toast(e.message, 'error'); }
        };
    </script>
</body>
</html>
