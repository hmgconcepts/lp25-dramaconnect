<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center | DramaConnect Enterprise</title>
    <meta name="theme-color" content="#003399">
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/fallback.css">
    <script src="../assets/js/boot.js"></script>
</head>
<body class="bg-slate-50 min-h-screen app-shell">
    <div id="app-sidebar"></div>
    <main class="app-main">
        <div id="page-header"></div>

        <!-- KPIs -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6 mb-8">
            <div class="glass-card p-5 border-l-4 border-blue-600 animate-fade-in">
                <div class="flex justify-between items-start">
                    <div><p class="text-xs font-bold text-slate-400 uppercase">Personnel</p><h2 id="stat-members" class="text-2xl md:text-3xl font-black text-slate-800">—</h2></div>
                    <div class="p-3 bg-blue-50 text-blue-600 rounded-2xl"><i class="fas fa-users"></i></div>
                </div>
            </div>
            <div class="glass-card p-5 border-l-4 border-green-600 animate-fade-in" style="animation-delay:.1s">
                <div class="flex justify-between items-start">
                    <div><p class="text-xs font-bold text-slate-400 uppercase">Net Treasury</p><h2 id="stat-balance" class="text-2xl md:text-3xl font-black text-slate-800">—</h2></div>
                    <div class="p-3 bg-green-50 text-green-600 rounded-2xl"><i class="fas fa-money-bill-wave"></i></div>
                </div>
            </div>
            <div class="glass-card p-5 border-l-4 border-red-600 animate-fade-in" style="animation-delay:.2s">
                <div class="flex justify-between items-start">
                    <div><p class="text-xs font-bold text-slate-400 uppercase">Productions</p><h2 id="stat-plays" class="text-2xl md:text-3xl font-black text-slate-800">—</h2></div>
                    <div class="p-3 bg-red-50 text-red-600 rounded-2xl"><i class="fas fa-theater-masks"></i></div>
                </div>
            </div>
            <div class="glass-card p-5 border-l-4 border-yellow-500 animate-fade-in" style="animation-delay:.3s">
                <div class="flex justify-between items-start">
                    <div><p class="text-xs font-bold text-slate-400 uppercase">Avg Attendance</p><h2 id="stat-attendance" class="text-2xl md:text-3xl font-black text-slate-800">—</h2></div>
                    <div class="p-3 bg-yellow-50 text-yellow-600 rounded-2xl"><i class="fas fa-user-check"></i></div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8 mb-8">
            <div class="lg:col-span-2 glass-card p-6 md:p-8">
                <h3 class="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2"><i class="fas fa-chart-pie text-blue-600"></i> Treasury Distribution</h3>
                <div class="h-72"><canvas id="financeChart"></canvas></div>
            </div>
            <div class="glass-card p-6 md:p-8">
                <h3 class="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2"><i class="fas fa-calendar-days text-green-600"></i> Upcoming</h3>
                <div id="upcoming-list" class="space-y-3"><p class="text-slate-400 text-sm">Loading…</p></div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8">
            <div class="lg:col-span-2 glass-card p-6 md:p-8">
                <h3 class="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2"><i class="fas fa-chart-line text-blue-600"></i> Monthly Cash Flow</h3>
                <div class="h-64"><canvas id="flowChart"></canvas></div>
            </div>
            <div class="glass-card p-6 md:p-8">
                <h3 class="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2"><i class="fas fa-bullhorn text-red-600"></i> Latest Announcement</h3>
                <div id="ann-list" class="space-y-3"><p class="text-slate-400 text-sm">Loading…</p></div>
            </div>
        </div>
    </main>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/ui.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/db.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/install.js"></script>
    <script>
        let charts = {};
        async function init() {
            const user = await Auth.checkSession();
            if (!user) return;
            Layout.renderSidebar('dashboard', user);
            Layout.registerPWA();
            document.getElementById('page-header').innerHTML =
                Layout.renderHeader('Enterprise Dashboard', `Welcome back, <span class="font-bold text-blue-600">${UI.esc(user.full_name || 'Member')}</span>`);
            Layout.setDate();
            if (Layout.loadNotifications) Layout.loadNotifications(user);

            try {
                const [members, trans, plays, rehearsals, events, anns] = await Promise.all([
                    DB.getMembers(), DB.getTransactions(), DB.getProductions(),
                    DB.getRehearsals().catch(() => []), DB.getEvents().catch(() => []), DB.getAnnouncements().catch(() => [])
                ]);

                document.getElementById('stat-members').innerText = members.length;
                document.getElementById('stat-plays').innerText = plays.length;
                const income = trans.filter(t => t.type === 'income').reduce((a, b) => a + Number(b.amount), 0);
                const expense = trans.filter(t => t.type === 'expense').reduce((a, b) => a + Number(b.amount), 0);
                document.getElementById('stat-balance').innerText = Utils.formatCurrency(income - expense);

                if (rehearsals.length && members.length) {
                    const present = rehearsals.reduce((s, r) => s + (r.attendance ? r.attendance.filter(a => a.status === 'present').length : 0), 0);
                    const pct = Math.round((present / (rehearsals.length * members.length)) * 100);
                    document.getElementById('stat-attendance').innerText = (isFinite(pct) ? pct : 0) + '%';
                } else document.getElementById('stat-attendance').innerText = '0%';

                renderDoughnut(income, expense);
                renderFlow(trans);
                renderUpcoming(events, plays);
                renderAnnouncement(anns);
            } catch (e) { console.error(e); UI.toast('Could not load dashboard: ' + e.message, 'error'); }
        }

        function renderDoughnut(income, expense) {
            const ctx = document.getElementById('financeChart').getContext('2d');
            if (charts.d) charts.d.destroy();
            charts.d = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: ['Income', 'Expense'], datasets: [{ data: [income, expense], backgroundColor: ['#16a34a', '#dc2626'], borderWidth: 0, hoverOffset: 12 }] },
                options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } }, cutout: '68%' }
            });
        }

        function renderFlow(trans) {
            const months = {};
            trans.forEach(t => {
                const key = (t.date || '').slice(0, 7);
                if (!key) return;
                if (!months[key]) months[key] = { income: 0, expense: 0 };
                months[key][t.type === 'income' ? 'income' : 'expense'] += Number(t.amount);
            });
            const keys = Object.keys(months).sort().slice(-6);
            const ctx = document.getElementById('flowChart').getContext('2d');
            if (charts.f) charts.f.destroy();
            charts.f = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: keys.length ? keys : ['No data'],
                    datasets: [
                        { label: 'Income', data: keys.map(k => months[k].income), backgroundColor: '#16a34a', borderRadius: 6 },
                        { label: 'Expense', data: keys.map(k => months[k].expense), backgroundColor: '#dc2626', borderRadius: 6 }
                    ]
                },
                options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true } } }
            });
        }

        function renderUpcoming(events, plays) {
            const items = [];
            events.forEach(e => { const d = Utils.daysUntil(e.event_date); if (d !== null && d >= 0) items.push({ title: e.title, date: e.event_date, type: 'Event', icon: 'fa-calendar-day', color: 'text-green-600' }); });
            plays.forEach(p => { const d = Utils.daysUntil(p.performance_date); if (d !== null && d >= 0) items.push({ title: p.title, date: p.performance_date, type: 'Performance', icon: 'fa-theater-masks', color: 'text-red-600' }); });
            items.sort((a, b) => new Date(a.date) - new Date(b.date));
            const host = document.getElementById('upcoming-list');
            if (!items.length) { host.innerHTML = '<p class="text-slate-400 text-sm">Nothing scheduled.</p>'; return; }
            host.innerHTML = items.slice(0, 5).map(i => `
                <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl">
                    <i class="fas ${i.icon} ${i.color}"></i>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-bold text-slate-800 truncate">${UI.esc(i.title)}</p>
                        <p class="text-xs text-slate-400">${i.type} • ${Utils.relativeTime(i.date)}</p>
                    </div>
                </div>`).join('');
        }

        function renderAnnouncement(anns) {
            const host = document.getElementById('ann-list');
            if (!anns.length) { host.innerHTML = '<p class="text-slate-400 text-sm">No announcements yet.</p>'; return; }
            host.innerHTML = anns.slice(0, 3).map(a => `
                <div class="p-3 bg-blue-50 rounded-xl border border-blue-100">
                    <p class="text-sm font-bold text-slate-800">${UI.esc(a.title)}</p>
                    <p class="text-xs text-slate-500 mt-1">${UI.esc(a.body || '')}</p>
                    <p class="text-[10px] text-slate-400 mt-1">${Utils.formatDate(a.created_at)}</p>
                </div>`).join('');
        }
        init();
    </script>
</body>
</html>
