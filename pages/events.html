<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | DramaConnect Enterprise</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/fallback.css">
    <script src="../assets/js/boot.js"></script>
</head>
<body class="bg-slate-50 min-h-screen app-shell">
    <div id="app-sidebar"></div>
    <main class="app-main">
        <div id="page-header"></div>

        <div id="admin-add" class="glass-card p-6 mb-8 admin-only">
            <h3 class="font-bold text-slate-800 mb-4"><i class="fas fa-calendar-plus text-blue-600 mr-2"></i> Schedule Event</h3>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                <input id="e-title" placeholder="Event title" class="dc-input md:col-span-2">
                <input id="e-date" type="datetime-local" class="dc-input">
                <input id="e-location" placeholder="Location" class="dc-input">
            </div>
            <textarea id="e-desc" rows="2" placeholder="Description (optional)" class="dc-input mt-3"></textarea>
            <button id="e-add" class="dc-btn dc-btn-primary mt-4">Add Event</button>
        </div>

        <div id="event-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"><p class="text-slate-400 text-sm">Loading…</p></div>
    </main>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/i18n.js"></script>
    <script src="../assets/js/ui.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/db.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/install.js"></script>
    <script>
        let me = null;
        async function init() {
            me = await Auth.checkSession();
            if (!me) return;
            Layout.renderSidebar('events', me);
            document.getElementById('page-header').innerHTML = Layout.renderHeader('Events', 'Department calendar');
            Layout.setDate();
            if (Layout.loadNotifications) Layout.loadNotifications(me);
            if (Auth.isAdmin(me)) {
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
                document.getElementById('e-add').onclick = add;
            }
            load();
        }
        let myRsvps = {};
        async function load() {
            const host = document.getElementById('event-list');
            try {
                const [events, rsvpRows] = await Promise.all([DB.getEvents(), DB.getMyRsvps(me.id).catch(() => [])]);
                myRsvps = {}; rsvpRows.forEach(r => myRsvps[r.event_id] = r.response);
                if (!events.length) { host.innerHTML = '<p class="text-slate-400 text-sm">No events scheduled.</p>'; return; }
                const isAdmin = Auth.isAdmin(me);
                // Load RSVP counts per event (one query each, small N).
                const counts = {};
                await Promise.all(events.map(async ev => {
                    try { const rs = await DB.getRsvps(ev.id); counts[ev.id] = rs; } catch (e) { counts[ev.id] = []; }
                }));
                host.innerHTML = events.map(e => {
                    const days = Utils.daysUntil(e.event_date);
                    const past = days !== null && days < 0;
                    const rs = counts[e.id] || [];
                    const going = rs.filter(r => r.response === 'going').length;
                    const maybe = rs.filter(r => r.response === 'maybe').length;
                    const mine = myRsvps[e.id];
                    const btn = (val, label, cls) => `<button onclick="rsvp('${e.id}','${val}')" class="text-xs px-3 py-1 rounded-full font-bold ${mine===val?cls:'bg-slate-100 text-slate-600'}">${label}</button>`;
                    return `
                    <div class="glass-card p-6 animate-fade-in ${past ? 'opacity-60' : ''}">
                        <div class="flex items-center justify-between mb-2">
                            <span class="p-2 bg-green-50 text-green-600 rounded-xl"><i class="fas fa-calendar-day"></i></span>
                            <span class="badge ${past ? 'badge-member' : 'badge-green'}">${Utils.relativeTime(e.event_date)}</span>
                        </div>
                        <h4 class="font-bold text-slate-800">${UI.esc(e.title)}</h4>
                        <p class="text-sm text-slate-500 mt-1"><i class="fas fa-clock mr-1"></i> ${Utils.formatDateTime(e.event_date)}</p>
                        ${e.location ? `<p class="text-sm text-slate-500"><i class="fas fa-location-dot mr-1"></i> ${UI.esc(e.location)}</p>` : ''}
                        ${e.description ? `<p class="text-xs text-slate-400 mt-2">${UI.esc(e.description)}</p>` : ''}
                        <div class="mt-3 pt-3 border-t border-slate-100">
                            <p class="text-xs text-slate-400 mb-2">RSVP: <strong>${going}</strong> going • <strong>${maybe}</strong> maybe</p>
                            ${!past ? `<div class="flex gap-2">
                                ${btn('going','✅ Going','bg-green-600 text-white')}
                                ${btn('maybe','🤔 Maybe','bg-yellow-500 text-white')}
                                ${btn('no','❌ No','bg-red-600 text-white')}
                            </div>` : ''}
                        </div>
                        ${isAdmin ? `<button class="text-red-600 text-xs font-bold hover:underline mt-3" onclick="del('${e.id}')">Delete</button> <button class="text-blue-600 text-xs font-bold hover:underline mt-3" onclick="viewRsvps('${e.id}')">View RSVPs</button>` : ''}
                    </div>`;
                }).join('');
            } catch (e) { host.innerHTML = `<p class="text-red-500">${UI.esc(e.message)}</p>`; }
        }
        async function rsvp(id, response) {
            try { await DB.setRsvp(id, me.id, response); UI.toast('RSVP saved.', 'success', 1500); load(); }
            catch (e) { UI.toast(e.message, 'error'); }
        }
        async function viewRsvps(id) {
            try {
                const rs = await DB.getRsvps(id);
                const group = v => rs.filter(r => r.response === v).map(r => UI.esc(r.profiles ? r.profiles.full_name : 'Member')).join(', ') || '—';
                UI.modal(`<div class="p-6">
                    <h3 class="text-lg font-bold text-slate-800 mb-3">RSVPs</h3>
                    <p class="text-sm mb-2"><span class="badge badge-green">Going</span> ${group('going')}</p>
                    <p class="text-sm mb-2"><span class="badge badge-yellow">Maybe</span> ${group('maybe')}</p>
                    <p class="text-sm mb-4"><span class="badge badge-red">No</span> ${group('no')}</p>
                    <button class="dc-btn bg-slate-100 text-slate-700" onclick="this.closest('.fixed').remove()">Close</button>
                </div>`, 'max-w-md');
            } catch (e) { UI.toast(e.message, 'error'); }
        }
        window.rsvp = rsvp; window.viewRsvps = viewRsvps;
        async function add() {
            const title = document.getElementById('e-title').value.trim();
            const date = document.getElementById('e-date').value;
            if (!title || !date) { UI.toast('Title and date are required.', 'warning'); return; }
            try {
                await DB.addEvent({
                    title, event_date: date,
                    location: document.getElementById('e-location').value.trim() || null,
                    description: document.getElementById('e-desc').value.trim() || null
                });
                await DB.logActivity('event_add', title);
                ['e-title', 'e-date', 'e-location', 'e-desc'].forEach(id => document.getElementById(id).value = '');
                UI.toast('Event added.', 'success');
                load();
            } catch (e) { UI.toast(e.message, 'error'); }
        }
        async function del(id) {
            if (!await UI.confirm('Delete this event?')) return;
            try { await DB.deleteEvent(id); UI.toast('Deleted.', 'success'); load(); }
            catch (e) { UI.toast(e.message, 'error'); }
        }
        window.del = del;
        init();
    </script>
</body>
</html>
