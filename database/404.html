<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page not found | DramaConnect</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #0f172a, #1e3a8a); color: #0f172a; }
        .card { background: #fff; border-radius: 1.5rem; max-width: 30rem; width: 100%; padding: 2.25rem 2rem; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,.45); }
        .mask { font-size: 3.5rem; line-height: 1; }
        h1 { font-size: 1.5rem; margin: .75rem 0 .5rem; }
        p { color: #475569; line-height: 1.55; margin: 0 0 1rem; }
        code { background: #f1f5f9; padding: .1rem .4rem; border-radius: .35rem; font-size: .85rem; word-break: break-all; }
        .row { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; margin-top: 1.25rem; }
        a.btn { display: inline-block; padding: .7rem 1.1rem; border-radius: .8rem; font-weight: 700; text-decoration: none; font-size: .9rem; }
        .primary { background: #1d4ed8; color: #fff; } .ghost { background: #f1f5f9; color: #334155; }
        #hint { display: none; background: #fefce8; border: 1px solid #fde68a; color: #854d0e; border-radius: .8rem; padding: .7rem; font-size: .85rem; text-align: left; }
    </style>
</head>
<body>
    <main class="card" role="main">
        <div class="mask" aria-hidden="true">🎭</div>
        <h1>This scene isn't in the script</h1>
        <p>We couldn't find <code id="path">this page</code>. It may have been moved, or the link was typed or copied incompletely.</p>
        <div id="hint"></div>
        <div class="row">
            <a class="btn primary" href="/pages/home.html">Go to my dashboard</a>
            <a class="btn ghost" href="/index.html">Sign in</a>
            <a class="btn ghost" href="/pages/help.html">Help centre</a>
        </div>
    </main>
    <script>
        (function () {
            var path = location.pathname + location.search;
            document.getElementById('path').textContent = path.length > 80 ? path.slice(0, 77) + '…' : path;
            var hint = document.getElementById('hint'), p = location.pathname.toLowerCase();
            function show(html, href) { hint.style.display = 'block'; hint.innerHTML = html; if (href) { var a = document.createElement('a'); a.href = href; a.textContent = ' Open it →'; a.style.fontWeight = '700'; hint.appendChild(a); } }
            // Common broken-link repairs: missing /pages/ prefix, missing .html, old/alternate names.
            var name = p.split('/').pop().replace(/\.html?$/, '');
            var known = { register: 1, verify: 1, reset: 1, programs: 1, calendar: 1, roster: 1, care: 1, idcard: 1, home: 1, help: 1, attendance: 1, profile: 1, events: 1, rehearsals: 1 };
            var alias = { programmes: 'programs', program: 'programs', signup: 'register', rota: 'roster', 'id-card': 'idcard', card: 'idcard', dashboard: 'home', faq: 'help' };
            var target = known[name] ? name : alias[name];
            if (target && p.indexOf('/pages/' + target + '.html') === -1) {
                show('<b>Did you mean this page?</b>', '/pages/' + target + '.html' + location.search + location.hash);
            } else if (/[?&](p|t)=/.test(location.search)) {
                show('<b>Looks like a programme or ticket link.</b>', '/pages/register.html' + location.search);
            }
        })();
    </script>
</body>
</html>
