# Layer 3 + Layer 4 — Supabase keep-alive heartbeat (self-configuring)
#
# Live audit (24 Sep 2026): every run of the previous version failed at
# "Validate required secrets" because SUPABASE_URL / SUPABASE_ANON_KEY were
# never added, so this layer had never written a single heartbeat.
#
# v14.1 behaviour — no secrets required:
#   1. The Supabase URL and anon key are resolved in this order:
#        repository secrets → repository variables → assets/js/config.js
#      The anon key is already public (it ships to every browser and is
#      constrained by RLS), so reading it from config.js is safe.
#   2. It calls dc_keep_alive('github-actions') with retries and verifies the
#      answer ("written" or "throttled" both count as success).
#   3. Layer 4: if the repository has had no commit for 30+ days it commits a
#      tiny timestamp file so GitHub does not disable scheduled workflows
#      after 60 days of repository inactivity.
# See docs/SUPABASE_FREE_TIER_PROTECTION.md → Layer 3 and Layer 4.

name: Supabase resilience heartbeat

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dramaconnect-keep-alive
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve Supabase connection (secrets → variables → config.js)
        id: conn
        env:
          S_URL: ${{ secrets.SUPABASE_URL }}
          S_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          V_URL: ${{ vars.SUPABASE_URL }}
          V_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail
          url="${S_URL:-${V_URL:-}}"; key="${S_KEY:-${V_KEY:-}}"; origin="secrets/variables"
          if [ -z "$url" ] || [ -z "$key" ]; then
            cfg=assets/js/config.js
            if [ -f "$cfg" ]; then
              url="${url:-$(grep -oE 'https://[a-z0-9]{20}\.supabase\.co' "$cfg" | head -1 || true)}"
              key="${key:-$(grep -oE 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' "$cfg" | head -1 || true)}"
              origin="assets/js/config.js"
            fi
          fi
          [ -n "$key" ] && echo "::add-mask::$key"
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::warning title=Heartbeat not configured::No Supabase URL/anon key found in secrets, variables or assets/js/config.js. Fill in assets/js/config.js (see docs/SUPABASE_FREE_TIER_PROTECTION.md, Layer 3)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The masked key is handed over through a runner-temp file, never a step output.
          printf 'SB_URL=%s\nSB_KEY=%s\n' "$url" "$key" > "$RUNNER_TEMP/sb.env"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Connection resolved from $origin → $url"

      - name: Write and verify database heartbeat
        if: steps.conn.outputs.ready == 'true'
        run: |
          set -uo pipefail
          . "$RUNNER_TEMP/sb.env"
          for attempt in 1 2 3 4; do
            code=$(curl -sS -o /tmp/hb.json -w '%{http_code}' --connect-timeout 10 --max-time 25 \
              -X POST "$SB_URL/rest/v1/rpc/dc_keep_alive" \
              -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
              -H 'Content-Type: application/json' \
              --data '{"p_source":"github-actions"}' || echo 000)
            if [ "$code" = "200" ] && jq -e '.ok == true and (.status == "written" or .status == "throttled")' /tmp/hb.json >/dev/null 2>&1; then
              echo "✅ Heartbeat written and verified: $(cat /tmp/hb.json)"
              exit 0
            fi
            if [ "$code" = "404" ] && grep -q 'dc_keep_alive' /tmp/hb.json 2>/dev/null; then
              echo "::error title=Heartbeat RPC missing::dc_keep_alive does not exist on this project. Run database/complete-schema.sql once in the Supabase SQL Editor."
              exit 1
            fi
            echo "Attempt $attempt: HTTP $code $(head -c 300 /tmp/hb.json 2>/dev/null || true)"
            sleep $((attempt * 15))
          done
          echo "::error title=Heartbeat failed::Supabase did not accept the heartbeat after 4 attempts (last HTTP $code). If the project is paused, restore it (Layer 10); otherwise check the anon key in assets/js/config.js."
          exit 1

      - name: Layer 4 — keep GitHub schedules alive (self-commit only when idle ≥ 30 days)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -uo pipefail
          now="$(date +%s)"
          last="$(git log -1 --format=%ct)"
          age_days="$(( (now - last) / 86400 ))"
          if [ "$age_days" -lt 30 ]; then
            echo "Repository activity is ${age_days} day(s) old; no preservation commit needed."
            exit 0
          fi
          printf 'Last scheduled preservation: %s\n' "$(date -u +%FT%TZ)" > .github/.keepalive
          git config user.name 'dramaconnect-resilience-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/.keepalive
          git commit -m 'chore: preserve scheduled resilience workflow [skip ci]' || true
          git push || echo "::warning title=Push rejected::Could not push the preservation commit. Set Settings → Actions → General → Workflow permissions → Read and write."
